title: eUICC.tech
description: "Comprehensive technical knowledge base covering 12 GSMA eSIM RSP specifications — SGP.02, SGP.22, SGP.32 and more. 84+ articles on eSIM architecture, profile download, IoT provisioning, and conformance testing."
theme: jekyll-theme-midnight
show_downloads: false
baseurl: ""
url: "https://euicc.tech"

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

# Feature flags
jobs_page: false
storybooks_page: true
technical_page: true
home_page: simple
article_index: minimal
crosslinks: false
home_link: false

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-image.png
  - scope:
      path: "docs/articles"
    values:
      type: article
