<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 520">
<style>text { font-family: system-ui, sans-serif; }</style>
<rect width="100%" height="100%" fill="#0a1628"/>

<!-- Title -->
<text x="525" y="30" fill="white" font-size="14" font-weight="700" text-anchor="middle">ASN.1 to APDU to AT Command: One Payload, Three Layers</text>
<text x="525" y="48" fill="#94a3b8" font-size="9" text-anchor="middle">A signed eUICC Package travels from the eIM to the chip, re-wrapped at every hop</text>
<line x1="30" y1="58" x2="1020" y2="58" stroke="#1e293b" stroke-width="1"/>

<!-- ===== Actors ===== -->
<!-- eIM -->
<rect x="30" y="80" width="180" height="70" rx="8" fill="rgba(251,146,60,0.35)" stroke="#fb923c" stroke-width="2"/>
<text x="120" y="108" fill="white" font-size="13" font-weight="700" text-anchor="middle">eIM</text>
<text x="120" y="126" fill="#94a3b8" font-size="8" text-anchor="middle">signs the package</text>
<text x="120" y="140" fill="#fb923c" font-size="7" text-anchor="middle">ESipa server</text>

<!-- IPA (application processor) -->
<rect x="295" y="80" width="210" height="70" rx="8" fill="rgba(8,51,68,0.5)" stroke="#22d3ee" stroke-width="2"/>
<text x="400" y="108" fill="white" font-size="13" font-weight="700" text-anchor="middle">IPA</text>
<text x="400" y="126" fill="#94a3b8" font-size="8" text-anchor="middle">relays, never decodes</text>
<text x="400" y="140" fill="#22d3ee" font-size="7" text-anchor="middle">app processor / firmware</text>

<!-- Modem (baseband) -->
<rect x="600" y="80" width="170" height="70" rx="8" fill="rgba(136,19,55,0.3)" stroke="#fb7185" stroke-width="2"/>
<text x="685" y="108" fill="white" font-size="13" font-weight="700" text-anchor="middle">Modem</text>
<text x="685" y="126" fill="#94a3b8" font-size="8" text-anchor="middle">baseband</text>
<text x="685" y="140" fill="#fb7185" font-size="7" text-anchor="middle">passes APDUs on</text>

<!-- eUICC -->
<rect x="850" y="80" width="170" height="70" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
<text x="935" y="108" fill="white" font-size="13" font-weight="700" text-anchor="middle">eUICC</text>
<text x="935" y="126" fill="#94a3b8" font-size="8" text-anchor="middle">ISD-R / ISD-P</text>
<text x="935" y="140" fill="#a78bfa" font-size="7" text-anchor="middle">verifies + executes</text>

<!-- ===== Hop 1: eIM to IPA ===== -->
<path fill="none" d="M 210 115 L 295 115" stroke="#fb923c" stroke-width="2"/>
<polygon points="295,115 287,111 287,119" fill="#fb923c"/>
<text x="252" y="106" fill="#fb923c" font-size="9" font-weight="600" text-anchor="middle">ESipa</text>
<text x="252" y="134" fill="#64748b" font-size="7" text-anchor="middle">ASN.1 TLV (DER)</text>

<!-- ===== Hop 2: IPA to modem ===== -->
<path fill="none" d="M 505 115 L 600 115" stroke="#22d3ee" stroke-width="2"/>
<polygon points="600,115 592,111 592,119" fill="#22d3ee"/>
<text x="552" y="106" fill="#22d3ee" font-size="9" font-weight="600" text-anchor="middle">AT+CSIM</text>
<text x="552" y="134" fill="#64748b" font-size="7" text-anchor="middle">raw APDU tunnel</text>

<!-- ===== Hop 3: modem to eUICC ===== -->
<path fill="none" d="M 770 115 L 850 115" stroke="#a78bfa" stroke-width="2"/>
<polygon points="850,115 842,111 842,119" fill="#a78bfa"/>
<text x="810" y="106" fill="#a78bfa" font-size="9" font-weight="600" text-anchor="middle">ISO 7816-4</text>
<text x="810" y="134" fill="#64748b" font-size="7" text-anchor="middle">APDU</text>

<!-- ===== Three-layer legend ===== -->
<text x="30" y="205" fill="white" font-size="11" font-weight="700">What each layer carries</text>

<!-- Layer 1: application / ASN.1 -->
<rect x="30" y="220" width="990" height="40" rx="6" fill="rgba(251,146,60,0.08)" stroke="#fb923c" stroke-width="0.8"/>
<text x="50" y="245" fill="#fb923c" font-size="10" font-weight="600">1. Application layer</text>
<text x="230" y="245" fill="white" font-size="9">ASN.1 TLV</text>
<text x="380" y="245" fill="#94a3b8" font-size="9">the signed eUICC package (EuiccPackageRequest)</text>

<!-- Layer 2: card / APDU -->
<rect x="30" y="270" width="990" height="40" rx="6" fill="rgba(76,29,149,0.1)" stroke="#a78bfa" stroke-width="0.8"/>
<text x="50" y="295" fill="#a78bfa" font-size="10" font-weight="600">2. Card layer</text>
<text x="230" y="295" fill="white" font-size="9">APDU</text>
<text x="380" y="295" fill="#94a3b8" font-size="9">LoadEuiccPackage C-APDU, ISO 7816-4</text>

<!-- Layer 3: transport / AT command -->
<rect x="30" y="320" width="990" height="40" rx="6" fill="rgba(136,19,55,0.1)" stroke="#fb7185" stroke-width="0.8"/>
<text x="50" y="345" fill="#fb7185" font-size="10" font-weight="600">3. Transport layer</text>
<text x="230" y="345" fill="white" font-size="9">AT command</text>
<text x="380" y="345" fill="#94a3b8" font-size="9">AT+CSIM tunnels the APDU through the modem</text>

<!-- ===== Bottom callout ===== -->
<rect x="30" y="385" width="990" height="52" rx="8" fill="rgba(6,78,59,0.08)" stroke="#34d399" stroke-width="1" stroke-dasharray="6,3"/>
<text x="525" y="408" fill="#34d399" font-size="10" text-anchor="middle">One payload, three wrappers. The eUICC Package is signed end to end, so the IPA must never re-encode it.</text>
<text x="525" y="426" fill="#64748b" font-size="8" text-anchor="middle">Parse the outer ESipa message, relay the inner blob untouched. Every byte change breaks the signature.</text>

</svg>
